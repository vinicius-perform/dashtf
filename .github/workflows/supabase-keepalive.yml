# Reserva do keep-alive da Vercel: mantém o projeto Supabase ativo (plano gratuito pausa após ~7 dias sem uso).
# Roda a cada 2 dias e pode ser disparado manualmente em Actions → "Supabase keep-alive" → Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 14 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://aczsouypqgjlrqdmrtwq.supabase.co
      # Chave pública (anon) do painel — a mesma que já está em src/lib/supabase.ts
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjenNvdXlwcWdqbHJxZG1ydHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDQ0MzUsImV4cCI6MjEwMjY4MDQzNX0.3SCk-WeS9T5sTPP8R9McTXq5WY43cigcUC9H5kEAf7c
    steps:
      - name: Consulta leve na API REST do Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/sys_sync_status?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondeu HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then exit 1; fi
